# Emergency and anti-violence helpline numbers by country, for the app to show the
# RIGHT numbers based on the user's country/location. Language-neutral reference
# data — numbers and country codes do not translate.
#
# SAFETY-CRITICAL. `emergency` numbers are stable public-safety facts. The national
# anti-violence lines (`dv_helpline`) were sourced from findahelpline.com (a maintained
# global directory by ThroughLine) and each service's own official site, accessed
# 2026-09-24; each dv_helpline.url points to the service's official page. Because
# helpline numbers change, the app should ALSO offer the live directory
# https://findahelpline.com (it detects the user's country) — especially for
# countries not listed here with a dv_helpline.
#
# Fields per entry:
#   code / country            ISO 3166-1 alpha-2 code (or "EU"); English display name
#   emergency / emergency_notes  number to call in immediate danger (police / general)
#   dv_helpline:              optional national domestic-abuse / anti-violence line
#     name, number, hours (only when confirmed), languages, url (https), chat
#
# MEDICAL numbers (added 2026-10-06). The app's emergency button is for heavy bleeding,
# fainting or sudden intense pain, so it dials an AMBULANCE, which is not always the
# `emergency` line (110 in Japan, 112 in Norway and San Marino are the police):
#   medical           the number the app dials for a medical emergency, from a mobile
#   medical_source    the official page it was checked against on 2026-10-06: the
#                     country's government / health ministry / emergency service, the
#                     EU's 112 page for EU members, else a foreign ministry's travel advice
#                     (GOV.UK FCDO "Getting help", Canada's travel.gc.ca)
#   medical_notes     caveats
# The app does NOT read this column from the compiled database: iOS
# `MedicalEmergencyNumbers` (SoftlyKnowledge package) and Android
# `EmergencyNumbers.MEDICAL_EMERGENCY` carry the same table in code, with tests that
# pin it. Change a number here AND in both apps, or nowhere.
# Left out because official sources disagree or only one weak source exists (the app
# falls back to 112 there): Bolivia (118 / 165 / 168), Peru (106 is not nationwide vs
# 116), Nicaragua (128 vs 911), Morocco (15 vs 150), Afghanistan (102, one source),
# Cameroon (112 vs 119), Namibia, Angola (116 vs 112), Mozambique.
#
# Countries with only an emergency number (no single verified national dv line):
# RU and CA — no clear single national anti-violence line, so the app should fall
# back to the findahelpline directory for these.

helplines:
  - code: EU
    country: European Union
    emergency: "112"
    emergency_notes: 112 is the single emergency number across every EU country.

  - code: IT
    country: Italy
    emergency: "112"
