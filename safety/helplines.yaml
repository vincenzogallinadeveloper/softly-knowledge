# Emergency and anti-violence helpline numbers by country, for the app to show the
# RIGHT numbers based on the user's country/location. Language-neutral reference
# data — numbers and country codes do not translate.
#
# SAFETY-CRITICAL. Only verified numbers go here. `emergency` numbers are stable,
# widely published public-safety facts. National anti-violence (`dv_helpline`)
# numbers are added only when confirmed against an official source.
#
# Fields per entry:
#   code             ISO 3166-1 alpha-2 country code, or "EU" for the bloc default
#   country          English display name
#   emergency        the number to call in immediate danger (police / general)
#   emergency_notes  optional (e.g. a separate ambulance number)
#   dv_helpline:     optional national domestic-abuse / anti-violence helpline
#     name           service name
#     number         number or short code
#     hours          e.g. "24/7"
#     languages      optional list of language codes
#     url            official page (https)
#     chat           optional (true if an online chat exists)
#
# STATUS: emergency numbers populated for the app's main markets; the only
# verified dv_helpline so far is Italy's 1522. More national anti-violence lines
# (DE, FR, ES, UK, US, …) are pending source verification — see EDITORIAL_POLICY.

helplines:
  - code: EU
    country: European Union
    emergency: "112"
    emergency_notes: 112 is the single emergency number across every EU country.

  - code: IT
    country: Italy
    emergency: "112"
    dv_helpline:
      name: Numero antiviolenza e stalking (1522)
      number: "1522"
      hours: "24/7"
      languages: [it, en, fr, es, ar]
      url: https://www.1522.eu/
      chat: true

  - code: GB
    country: United Kingdom
    emergency: "999"
    emergency_notes: 112 also reaches emergency services in the UK.

  - code: IE
    country: Ireland
    emergency: "112"
    emergency_notes: 999 also works in Ireland.

