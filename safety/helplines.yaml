# Emergency and anti-violence helpline numbers by country, for the app to show the
# RIGHT numbers based on the user's country/location. Language-neutral reference
# data — numbers and country codes do not translate.
#
# SAFETY-CRITICAL. `emergency` numbers are stable public-safety facts. The national
# anti-violence lines (`dv_helpline`) were sourced from findahelpline.com (a maintained
# global directory by ThroughLine) and each service's own official site, accessed
# 2026-09-24; each dv_helpline.url points to the service's official page. Because
# helpline numbers change, the app should ALSO offer the live directory
# https://findahelpline.com (it detects the user's country) — especially for
# countries not listed here with a dv_helpline.
#
# Fields per entry:
#   code / country            ISO 3166-1 alpha-2 code (or "EU"); English display name
#   emergency / emergency_notes  number to call in immediate danger (police / general)
#   dv_helpline:              optional national domestic-abuse / anti-violence line
#     name, number, hours (only when confirmed), languages, url (https), chat
#
# Countries with only an emergency number (no single verified national dv line yet):
# TR, RU, ID, CN, CA, BE, HK — the app should fall back to findahelpline for these.

helplines:
  - code: EU
    country: European Union
    emergency: "112"
    emergency_notes: 112 is the single emergency number across every EU country.

  - code: IT
    country: Italy
    emergency: "112"
    dv_helpline:
      name: Numero antiviolenza e stalking (1522)
      number: "1522"
      hours: "24/7"
      languages: [it, en, fr, es, ar]
      url: https://www.1522.eu/
      chat: true

  - code: GB
    country: United Kingdom
    emergency: "999"
    emergency_notes: 112 also reaches emergency services in the UK.
    dv_helpline:
      name: National Domestic Abuse Helpline (Refuge)
      number: "0808 2000 247"
      hours: "24/7"
      url: https://www.nationaldahelpline.org.uk/
      chat: true

  - code: IE
    country: Ireland
    emergency: "112"
    emergency_notes: 999 also works in Ireland.
    dv_helpline:
      name: Women's Aid 24hr National Freephone Helpline
      number: "1800 341 900"
      hours: "24/7"
      url: https://www.womensaid.ie/

  - code: US
    country: United States
    emergency: "911"
    dv_helpline:
      name: National Domestic Violence Hotline
      number: "1-800-799-7233"
      hours: "24/7"
      url: https://www.thehotline.org/
      chat: true

  - code: CA
